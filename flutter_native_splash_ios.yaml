# 네이티브(시스템) 스플래시 설정 — iOS 전용.
# 변경 후 `dart run flutter_native_splash:create --path=flutter_native_splash_ios.yaml`
# 로 ios/Runner 의 런치 리소스를 재생성한다.
#
# Android 는 어댑티브 아이콘 규격(여백 포함) 이미지를 쓰므로 설정을 공유할 수
# 없다. Android 쪽 설정은 pubspec.yaml 의 flutter_native_splash 를 본다.
# 배경색은 두 플랫폼 모두 디자인 시스템 bg.base (#16171b) 로 맞춘다.
flutter_native_splash:
  color: "#16171b"
  # iOS 런치 스크린 중앙에 놓이는 로고. (여백 없는 원본 규격)
  image: assets/icon/ddara-normal.png
  android: false
  ios: true
